name: Source safety
on:
  push:
    branches: [main, 'codex/development-sync']
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Publication controller regressions (no models)
        run: python -m unittest discover -s tests -p test_source_sync.py -v
      - name: Completed-batch publication and recovery (local bare remotes only)
        run: python -m unittest discover -s tests -p test_auto_sync.py -v
      - name: Explicit public-source identity and transaction policy (no network)
        run: python -m unittest discover -s tests -p 'test_public_source*.py' -v
      - name: Frozen runner integrity and execution boundaries
        run: python -m unittest discover -s tests -p test_sync_runner.py -v
      - name: Journaled accepted-runtime upgrades (disposable task adapter)
        run: python -m unittest discover -s tests -p test_runtime_upgrade.py -v
      - name: Candidate input integrity and isolated smoke boundaries (no EXE launch)
        run: python -m unittest discover -s tests -p test_candidate_inputs.py -v
      - name: Private build environment inventory and drift boundaries
        run: python -m unittest discover -s tests -p test_build_environment.py -v
      - name: Windows owned-process lifecycle and crash cleanup (no models)
        run: python -m unittest discover -s tests -p test_build_process.py -v
      - name: Exact dependency materialization (synthetic inputs)
        run: python -m unittest discover -s tests -p test_build_materialize.py -v
      - name: Persistent candidate queue and acceptance contracts (disposable Git)
        run: python -m unittest discover -s tests -p test_candidate_builder.py -v
      - name: Deferred candidate selection and staging recovery (synthetic packaging)
        run: |
          if (!(Test-Path -LiteralPath tests/test_candidate_staging.py -PathType Leaf)) { throw 'Required staging regression suite is missing' }
          python -m unittest discover -s tests -p test_candidate_staging.py -v
      - name: Frozen candidate worker integrity (no builds)
        run: python -m unittest discover -s tests -p test_candidate_runner.py -v
      - name: Journaled candidate worker upgrades and artifact reuse (synthetic task)
        run: python -m unittest discover -s tests -p test_candidate_upgrade.py -v
      - name: Evidence-gated milestone documentation (synthetic receipts, real disposable Git)
        run: python -m unittest discover -s tests -p test_milestone_docs.py -v
      - name: Exact runtime compatibility contracts (no native inference)
        run: |
          if (!(Test-Path -LiteralPath tests/test_runtime_contracts.py -PathType Leaf)) { throw 'Required runtime contract suite is missing' }
          python -m unittest discover -s tests -p test_runtime_contracts.py -v
      - name: Actual Git index, privacy and completeness
        run: python scripts/sync_source.py precommit --report-dir "$env:RUNNER_TEMP/offlinegpt-publication"
      - name: Source-only inventory
        run: python scripts/audit_repository.py
